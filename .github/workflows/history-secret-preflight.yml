name: History Secret Preflight

on:
  push:
    branches:
      - 'security/history-secret-preflight-*'
  pull_request:
    branches: [master]
    paths:
      - 'scripts/security/scan_git_history_secrets.py'
      - '.github/workflows/history-secret-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-scan:
    name: Value-Safe Full History Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run value-safe scanner
        run: |
          mkdir -p security-evidence
          python3 scripts/security/scan_git_history_secrets.py . \
            --json-out security-evidence/git-history-secret-preflight.json

      - name: Assert no secret values are emitted
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('security-evidence/git-history-secret-preflight.json')
          data = json.loads(p.read_text())
          assert data['secret_values_emitted'] is False
          for item in data['findings']:
              assert set(item) == {'detector','commit','path'}
          print('VALUE_SAFE_EVIDENCE=PASS')
          print(f"COMMITS_SCANNED={data['commit_count_scanned']}")
          print(f"FINDING_COUNT={data['finding_count']}")
          PY

      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: git-history-secret-preflight
          path: security-evidence/git-history-secret-preflight.json
          retention-days: 7
          if-no-files-found: error
